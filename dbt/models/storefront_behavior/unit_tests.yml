version: 2

unit_tests:
- name: mart_storefront_session_cart_before_first_purchase
  description: >-
    Only add_to_cart events before the first purchase count. The last event
    breaks a timestamp tie by the greater event_id.
  model: mart_storefront_session
  given:
  - input: ref('fct_storefront_events')
    rows:
    - {session_id: s1, user_id: u1, event_id: e1, event_type: add_to_cart, product_id: p1, event_time: "2026-01-01 10:00:00"}
    - {session_id: s1, user_id: u1, event_id: e2, event_type: purchase, product_id: p1, event_time: "2026-01-01 10:05:00"}
    - {session_id: s1, user_id: u1, event_id: e3, event_type: add_to_cart, product_id: p2, event_time: "2026-01-01 10:10:00"}
    - {session_id: s1, user_id: u1, event_id: e4, event_type: page_view, product_id: p3, event_time: "2026-01-01 10:10:00"}
  expect:
    rows:
    - {session_id: s1, user_id: u1, event_count: 4, has_cart: true, has_purchase: true, cart_events_before_first_purchase: 1, last_event_type: page_view, last_product_id: p3}
- name: mart_storefront_product_behavior_session_counts
  description: >-
    Views, carts, and sessions count per product. An event with no product is
    left out. A session counts as ended on the product it ended on.
  model: mart_storefront_product_behavior
  given:
  - input: ref('fct_storefront_events')
    rows:
    - {session_id: s1, event_id: e1, event_type: page_view, product_id: p1}
    - {session_id: s1, event_id: e2, event_type: add_to_cart, product_id: p1}
    - {session_id: s1, event_id: e3, event_type: page_view}
    - {session_id: s2, event_id: e4, event_type: page_view, product_id: p1}
    - {session_id: s2, event_id: e5, event_type: page_view, product_id: p2}
  - input: ref('mart_storefront_session')
    rows:
    - {session_id: s1, last_product_id: p1}
    - {session_id: s2, last_product_id: p2}
  expect:
    rows:
    - {product_id: p1, view_count: 2, cart_count: 1, purchase_count: 0, sessions_viewed: 2, sessions_purchased: 0, sessions_ended_on_product: 1}
    - {product_id: p2, view_count: 1, cart_count: 0, purchase_count: 0, sessions_viewed: 1, sessions_purchased: 0, sessions_ended_on_product: 1}
- name: mart_storefront_user_behavior_user_without_sessions
  description: A user with no sessions keeps a row with zero counts and no last session time.
  model: mart_storefront_user_behavior
  given:
  - input: ref('dim_storefront_users')
    rows:
    - {user_id: u1}
    - {user_id: u2}
  - input: ref('mart_storefront_session')
    rows:
    - {session_id: s1, user_id: u1, has_cart: true, has_purchase: false}
  - input: ref('fct_storefront_events')
    rows:
    - {session_id: s1, user_id: u1, event_id: e1, product_id: p1, event_time: "2026-01-01 10:00:00"}
  expect:
    rows:
    - {user_id: u1, session_count: 1, purchase_session_count: 0, products_touched: 1, cart_no_purchase_sessions: 1, last_session_time: "2026-01-01 10:00:00"}
    - {user_id: u2, session_count: 0, purchase_session_count: 0, products_touched: 0, cart_no_purchase_sessions: 0, last_session_time: null}
