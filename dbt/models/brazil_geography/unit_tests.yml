version: 2

unit_tests:
- name: dim_zip_prefix_modal_tie_takes_first_by_name
  description: >-
    A prefix seen once in two states takes the first state and city by name
    on the tie, sets the multi-state flag, and averages the coordinates.
  model: dim_zip_prefix
  given:
  - input: source('silver', 'olist_brazilian_ecommerce__geolocation')
    rows:
    - {geolocation_zip_code_prefix: "01001", geolocation_state: SP, geolocation_city: sao paulo, geolocation_lat: -23.0, geolocation_lng: -46.0}
    - {geolocation_zip_code_prefix: "01001", geolocation_state: RJ, geolocation_city: rio de janeiro, geolocation_lat: -22.0, geolocation_lng: -43.0}
  expect:
    rows:
    - {zip_prefix: "01001", modal_state: RJ, modal_city: rio de janeiro, mean_latitude: -22.5, mean_longitude: -44.5, multi_state_flag: true}
- name: fct_geography_quality_findings_contract_and_multi_state
  description: >-
    A quarantine finding of a geography dataset carries the Silver action; a
    finding of another dataset is left out. Only a multi-state ZIP prefix is
    a business anomaly (P3-07).
  model: fct_geography_quality_findings
  given:
  - input: source('gold_staging', 'quarantine_findings')
    rows:
    - {source_id: ibge_localidades, dataset: municipios, source_dataset: ibge_localidades.municipios, reason: null_violation, field_name: municipio-nome, business_key: '{"municipio-id":1}', record_index: 0, detail: 'null_violation at record_index=0', silver_action: flagged}
    - {source_id: olist_synth_cdc, dataset: orders, source_dataset: olist_synth_cdc.orders, reason: type_mismatch, field_name: updated_at, business_key: '{"order_id":"o9"}', record_index: 0, detail: 'type_mismatch at record_index=0', silver_action: excluded}
  - input: ref('dim_zip_prefix')
    rows:
    - {zip_prefix: "01001", multi_state_flag: true}
    - {zip_prefix: "01002", multi_state_flag: false}
  expect:
    rows:
    - {issue_class: contract_violation, reason: null_violation, source_dataset: ibge_localidades.municipios, business_key: '{"municipio-id":1}', field: municipio-nome, silver_action: flagged}
    - {issue_class: business_anomaly, reason: zip_prefix_multi_state, source_dataset: olist_brazilian_ecommerce.geolocation, business_key: '01001', field: null, silver_action: null}
