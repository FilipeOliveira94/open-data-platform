version: 2

unit_tests:
- name: mart_catalog_review_patterns_repeated_email_share
  description: >-
    Two of four reviews on one product share a reviewer email, so the
    repeated-email share is 0.5.
  model: mart_catalog_review_patterns
  given:
  - input: ref('fct_catalog_reviews')
    rows:
    - {product_id: 1, category: beauty, rating: 5, reviewer_email: a@example.test, comment_length: 10}
    - {product_id: 1, category: beauty, rating: 5, reviewer_email: a@example.test, comment_length: 20}
    - {product_id: 1, category: beauty, rating: 5, reviewer_email: b@example.test, comment_length: 30}
    - {product_id: 1, category: beauty, rating: 5, reviewer_email: c@example.test, comment_length: 40}
  expect:
    rows:
    - {category: beauty, rating: 5, review_count: 4, mean_comment_length: 25.0, repeated_reviewer_email_share: 0.5}
- name: fct_catalog_quality_findings_contract_and_repeated_email
  description: >-
    A DummyJSON quarantine finding carries the Silver action. A reviewer email
    repeated on one product is one finding; the same email on another product
    is not (P3-07).
  model: fct_catalog_quality_findings
  given:
  - input: source('gold_staging', 'quarantine_findings')
    rows:
    - {source_id: dummyjson_products, dataset: products, source_dataset: dummyjson_products.products, reason: type_mismatch, field_name: price, business_key: '{"id":7}', record_index: 0, detail: 'type_mismatch at record_index=0', silver_action: flagged}
    - {source_id: demo_storefront, dataset: clickstream, source_dataset: demo_storefront.clickstream, reason: null_violation, field_name: event_id, business_key: '{}', record_index: 0, detail: 'null_violation at record_index=0', silver_action: excluded}
  - input: ref('fct_catalog_reviews')
    rows:
    - {product_id: 1, reviewer_email: a@x.test}
    - {product_id: 1, reviewer_email: a@x.test}
    - {product_id: 2, reviewer_email: a@x.test}
  expect:
    rows:
    - {issue_class: contract_violation, reason: type_mismatch, source_dataset: dummyjson_products.products, business_key: '{"id":7}', field: price, silver_action: flagged}
    - {issue_class: business_anomaly, reason: repeated_reviewer_email, source_dataset: dummyjson_products.products, business_key: '1:a@x.test', field: reviewer_email, silver_action: null}
