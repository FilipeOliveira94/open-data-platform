version: 2

unit_tests:
- name: mart_review_drivers_counts_review_once_per_order
  description: >-
    An order with two items in different categories and one review gives one
    review in the `mixed` category, not one per item.
  model: mart_review_drivers
  given:
  - input: ref('fct_reviews')
    rows:
    - {review_id: r1, order_id: o1, review_score: 2, has_comment: true, answer_lag_days: 1.0}
  - input: ref('fct_orders')
    rows:
    - {order_id: o1, order_delivered_customer_date: "2018-01-10 00:00:00", order_estimated_delivery_date: "2018-01-05 00:00:00"}
  - input: ref('fct_order_items')
    rows:
    - {order_id: o1, order_item_id: 1, product_id: p1}
    - {order_id: o1, order_item_id: 2, product_id: p2}
  - input: ref('dim_products')
    rows:
    - {product_id: p1, category_english: toys}
    - {product_id: p2, category_english: garden_tools}
  expect:
    rows:
    - {delay_bucket: late, category_english: mixed, review_count: 1, mean_score: 2.0}
- name: dim_customers_latest_purchase_tie_takes_greater_order_id
  description: >-
    A person with two orders at the same purchase timestamp takes the address
    of the order with the greater order_id.
  model: dim_customers
  given:
  - input: source('silver', 'olist_brazilian_ecommerce__customers')
    rows:
    - {customer_id: c1, customer_unique_id: u1, customer_city: campinas, customer_state: SP, customer_zip_code_prefix: "13000"}
    - {customer_id: c2, customer_unique_id: u1, customer_city: sao paulo, customer_state: SP, customer_zip_code_prefix: "01001"}
  - input: source('silver', 'olist_brazilian_ecommerce__orders')
    rows:
    - {order_id: o1, customer_id: c1, order_purchase_timestamp: "2018-01-02 10:00:00"}
    - {order_id: o2, customer_id: c2, order_purchase_timestamp: "2018-01-02 10:00:00"}
  - input: ref('dim_municipality')
    rows:
    - {municipality_id: 3550308, municipality_name: São Paulo, municipality_name_norm: sao paulo, state_code: SP}
  expect:
    rows:
    - {customer_unique_id: u1, city: sao paulo, state_code: SP, zip_prefix: "01001", municipality_id: 3550308}
- name: mart_customer_retention_counts_delivered_orders_only
  description: >-
    Two delivered orders make a repeat buyer. One delivered and one canceled
    order do not.
  model: mart_customer_retention
  given:
  - input: ref('fct_orders')
    rows:
    - {order_id: o1, customer_unique_id: u1, order_status: delivered, purchase_date: "2018-01-02"}
    - {order_id: o2, customer_unique_id: u1, order_status: delivered, purchase_date: "2018-03-02"}
    - {order_id: o3, customer_unique_id: u2, order_status: delivered, purchase_date: "2018-01-05"}
    - {order_id: o4, customer_unique_id: u2, order_status: canceled, purchase_date: "2018-02-05"}
  expect:
    rows:
    - {customer_unique_id: u1, first_delivered_purchase_date: "2018-01-02", last_delivered_purchase_date: "2018-03-02", delivered_order_count: 2, is_repeat_buyer: true}
    - {customer_unique_id: u2, first_delivered_purchase_date: "2018-01-05", last_delivered_purchase_date: "2018-01-05", delivered_order_count: 1, is_repeat_buyer: false}
- name: mart_customer_geography_null_municipality_row
  description: >-
    A buyer with two orders in one municipality counts once and as a repeat
    buyer. A purchase address with no municipality is its own row with its
    own review score.
  model: mart_customer_geography
  given:
  - input: ref('fct_orders')
    rows:
    - {order_id: o1, customer_unique_id: u1, municipality_id: 1, municipality_name: Campinas}
    - {order_id: o2, customer_unique_id: u1, municipality_id: 1, municipality_name: Campinas}
    - {order_id: o3, customer_unique_id: u2}
  - input: ref('mart_customer_retention')
    rows:
    - {customer_unique_id: u1, is_repeat_buyer: true}
    - {customer_unique_id: u2, is_repeat_buyer: false}
  - input: ref('fct_reviews')
    rows:
    - {review_id: r1, order_id: o1, review_score: 4}
    - {review_id: r2, order_id: o3, review_score: 2}
  expect:
    rows:
    - {municipality_id: 1, municipality_name: Campinas, buyer_count: 1, repeat_buyer_count: 1, mean_review_score: 4.0}
    - {municipality_id: null, municipality_name: null, buyer_count: 1, repeat_buyer_count: 0, mean_review_score: 2.0}
