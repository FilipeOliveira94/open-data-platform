# Local developer profile (gitignored via dbt/profiles.yml pattern — keep example in profiles.yml.example).
# This checked-in copy uses only .env.example placeholders for Compose Trino.
open_data_platform:
  target: local
  outputs:
    local:
      type: trino
      method: none
      user: odp
      # dbt runs in the runtime image on the Compose network (P3-03).
      host: "{{ env_var('ODP_TRINO_HOST', 'trino') }}"
      port: "{{ env_var('ODP_TRINO_PORT', '8080') | int }}"
      database: iceberg
      schema: gold_shared
      threads: 4
      http_scheme: http
      timezone: UTC
