name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        # The airflow group is not a default group (P3-10); the DagBag tests need it.
        run: uv sync --frozen --group airflow

      - name: Ruff
        run: uv run ruff check src tests airflow docker/airflow

      - name: Markdown tables
        run: python scripts/check_markdown_tables.py

      - name: Pytest (unit)
        run: uv run --frozen --group airflow pytest tests/unit
