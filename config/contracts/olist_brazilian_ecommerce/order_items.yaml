contract_version: 2
source_id: olist_brazilian_ecommerce
dataset: order_items
description: "Items inside historical Olist orders. seller_id matches closed_deals.seller_id in the marketing funnel."
payload_format: csv
grain: "One row per item within an order."
primary_key:
  - order_id
  - order_item_id
update_pattern: snapshot
on_invalid: quarantine
on_structural_error: fail_batch
governance:
  domain: olist_analysis
  owner: platform
provenance:
  system: kaggle
fields:
  - name: order_id
    type: string
    nullable: false
    classification: internal
    description: "Order identifier."
  - name: order_item_id
    type: integer
    nullable: false
    classification: internal
    description: "Item sequence within the order, starting at 1."
  - name: product_id
    type: string
    nullable: false
    classification: internal
    description: "Product identifier."
  - name: seller_id
    type: string
    nullable: false
    classification: internal
    description: "Seller identifier. Equals olist_marketing_funnel closed_deals.seller_id."
  - name: shipping_limit_date
    type: timestamp
    nullable: false
    classification: internal
    description: "Seller shipping deadline."
  - name: price
    type: number
    nullable: false
    classification: internal
    description: "Item price."
  - name: freight_value
    type: number
    nullable: false
    classification: internal
    description: "Freight charged for the item."
changelog:
  - version: 1
    note: "Initial contract. Columns follow the published Brazilian E-Commerce Public Dataset by Olist (Kaggle olistbr/brazilian-ecommerce). No sample rows are stored."
  - version: 2
    note: "Document the published seller_id join: closed_deals.seller_id matches sellers.seller_id or order_items.seller_id."
