contract_version: 3
source_id: olist_brazilian_ecommerce
dataset: sellers
description: "Olist sellers. Location describes the business, not a customer. seller_id matches closed_deals.seller_id in the marketing funnel."
payload_format: csv
grain: "One row per seller."
primary_key:
  - seller_id
update_pattern: snapshot
on_invalid: quarantine
on_structural_error: fail_batch
governance:
  domain: olist_analysis
  owner: platform
provenance:
  system: kaggle
fields:
  - name: seller_id
    type: string
    nullable: false
    classification: internal
    description: "Seller identifier. Equals olist_marketing_funnel closed_deals.seller_id."
  - name: seller_zip_code_prefix
    type: string
    nullable: false
    classification: internal
    description: "Seller ZIP prefix as published, including a leading zero."
  - name: seller_city
    type: string
    nullable: false
    classification: internal
    description: "Seller city."
  - name: seller_state
    type: string
    nullable: false
    classification: internal
    description: "Seller state code."
changelog:
  - version: 1
    note: "Initial contract. Columns follow the published Brazilian E-Commerce Public Dataset by Olist (Kaggle olistbr/brazilian-ecommerce). No sample rows are stored."
  - version: 2
    note: "Document the published seller_id join: closed_deals.seller_id matches sellers.seller_id or order_items.seller_id."
  - version: 3
    note: "seller_zip_code_prefix is text. The published file keeps leading zeros."
