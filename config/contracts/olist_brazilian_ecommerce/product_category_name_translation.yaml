contract_version: 4
source_id: olist_brazilian_ecommerce
dataset: product_category_name_translation
description: "Portuguese to English product category labels published with Olist. The published CSV starts with a UTF-8 BOM. Column names are the names below."
payload_format: csv
grain: "One row per Portuguese category name."
primary_key:
  - product_category_name
update_pattern: snapshot
on_invalid: quarantine_flag
on_structural_error: fail_batch
volume_guard:
  min_row_ratio: 1.0
governance:
  source_family: olist_analysis
  owner: platform
provenance:
  system: kaggle
fields:
  - name: product_category_name
    type: string
    nullable: false
    classification: public
    description: "Portuguese category name."
  - name: product_category_name_english
    type: string
    nullable: false
    classification: public
    description: "English category label."
changelog:
  - version: 1
    note: "Initial contract. Columns follow the published Brazilian E-Commerce Public Dataset by Olist (Kaggle olistbr/brazilian-ecommerce). No sample rows are stored."
  - version: 2
    note: "Record that the published file starts with a UTF-8 BOM. Logical column names are unchanged."
  - version: 3
    note: "Rename governance.domain to governance.source_family. The value is the ingest source family, not a Gold schema."
  - version: 4
    note: "on_invalid is quarantine_flag: Silver keeps a quarantined record with _quarantined = true (P3-07). volume_guard.min_row_ratio 1.0: an execution below that share of the previous one does not replace Silver."
