contract_version: 4
source_id: olist_synth_cdc
dataset: order_items
description: "olist-synth-cdc order items. JSON array of rows."
payload_format: json
grain: "One row per item within an order."
primary_key:
  - order_id
  - order_item_id
update_pattern: incremental_window
on_invalid: quarantine_exclude
on_structural_error: fail_batch
governance:
  source_family: olist_analysis
  owner: platform
provenance:
  system: postgres
fields:
  - name: order_id
    type: string
    nullable: false
    classification: internal
    description: "Order identifier."
  - name: order_item_id
    type: integer
    nullable: false
    classification: internal
    description: "Item sequence within the order."
  - name: product_id
    type: string
    nullable: false
    classification: internal
    description: "Product identifier."
  - name: seller_id
    type: string
    nullable: false
    classification: internal
    description: "Seller identifier."
  - name: shipping_limit_date
    type: timestamp
    nullable: false
    classification: internal
    description: "Seller shipping deadline."
  - name: price
    type: decimal
    precision: 12
    scale: 2
    nullable: false
    classification: internal
    description: "Item price in BRL. PostgreSQL numeric(12,2)."
  - name: freight_value
    type: decimal
    precision: 12
    scale: 2
    nullable: false
    classification: internal
    description: "Freight charged for the item, in BRL. PostgreSQL numeric(12,2)."
  - name: updated_at
    type: timestamp
    nullable: false
    classification: internal
    description: "Platform watermark for windowed extract. Not an Olist source column."
changelog:
  - version: 1
    note: "Initial v1 contract. Columns align with the Olist dataset of the same grain, plus updated_at for the P1-06 watermark."
  - version: 2
    note: "Rename governance.domain to governance.source_family. The value is the ingest source family, not a Gold schema."
  - version: 3
    note: "price and freight_value are decimal(12,2), the PostgreSQL numeric(12,2) type: exact BRL amounts. The extract writes their exact text; they were number, written as a binary float (P3-18)."
  - version: 4
    note: "on_invalid is quarantine_exclude: Silver drops a quarantined record (P3-07)."
