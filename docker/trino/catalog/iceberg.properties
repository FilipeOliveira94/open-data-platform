# Iceberg JDBC catalog shared with Spark. Trino substitutes ${ENV:NAME}.
# catalog-name "local" is the Spark catalog name stored in iceberg_tables.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/${ENV:ICEBERG_CATALOG_DB}
iceberg.jdbc-catalog.connection-user=${ENV:POSTGRES_USER}
iceberg.jdbc-catalog.connection-password=${ENV:POSTGRES_PASSWORD}
iceberg.jdbc-catalog.catalog-name=local
iceberg.jdbc-catalog.default-warehouse-dir=s3a://${ENV:ODP_WAREHOUSE_BUCKET}/catalog
iceberg.jdbc-catalog.schema-version=V1
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.region=${ENV:MINIO_REGION}
s3.expect-continue-enabled=false
s3.chunked-encoding-enabled=false
