# Spark driver logging for the medallion scripts (P3-08).
# The console keeps the Spark default (WARN to stderr). Iceberg scan and
# commit reports from LoggingMetricsReporter go to a separate mode-600 file
# named by -Dodp.metrics.file. medallion_build reads the counts from it and
# deletes it. The file is never printed: a scan report carries its filter.
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

appender.metrics.type = File
appender.metrics.name = metrics
appender.metrics.fileName = ${sys:odp.metrics.file}
appender.metrics.append = true
appender.metrics.filePermissions = rw-------
appender.metrics.layout.type = PatternLayout
appender.metrics.layout.pattern = %m%n

logger.iceberg_metrics.name = org.apache.iceberg.metrics.LoggingMetricsReporter
logger.iceberg_metrics.level = info
logger.iceberg_metrics.additivity = false
logger.iceberg_metrics.appenderRef.metrics.ref = metrics
