# Phase 0 local baseline: PostgreSQL 16 + MinIO (S3-compatible).
# Image pins are explicit; do not use floating tags such as "latest".
#
# MinIO note: official public images were withdrawn in favor of commercial
# AIStor. Community MinIO remains AGPLv3; this stack uses coollabsio/minio
# at an upstream RELEASE tag (community rebuild of that lineage).
#
# Spark and Trino are opt-in via the "lakehouse" profile (P2-01, P2-02, and P2-03).
# Airflow is opt-in via the "orchestration" profile (P3-01).
# `docker compose up -d` starts PostgreSQL and MinIO only.
# `docker compose --profile lakehouse up` starts Trino and an idle Spark process.
# It does not run a SQL script. Pass the script to `docker compose run`.
# `make airflow-up` creates the log bucket and starts Airflow.
# LocalExecutor only: no Redis, Celery worker, Flower, or triggerer (D-006).

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-odp}:${POSTGRES_PASSWORD:-odp}@postgres:5432/${AIRFLOW_DB:-airflow}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-m2MF2P1kdm3qHPyXKJ7j0N5IGxBOswtdV9umW9-n6FA=}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAG_RUN_CONF_OVERRIDES_PARAMS: "True"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-jwt}
  AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_JWT_ISSUER:-airflow}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
  AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://${ODP_AIRFLOW_LOG_BUCKET:-odp-airflow-logs}/task-logs
  AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: minio_logs
  AIRFLOW__LOGGING__ENCRYPT_S3_LOGS: "False"
  AIRFLOW_CONN_MINIO_LOGS: '{"conn_type":"aws","login":"${MINIO_ROOT_USER:-minioadmin}","password":"${MINIO_ROOT_PASSWORD:-minioadmin}","extra":{"endpoint_url":"http://minio:9000","region_name":"${MINIO_REGION:-us-east-1}","config_kwargs":{"s3":{"addressing_style":"path"}}}}'
  AIRFLOW_UID: ${AIRFLOW_UID:-50000}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  ODP_AIRFLOW_LOG_BUCKET: ${ODP_AIRFLOW_LOG_BUCKET:-odp-airflow-logs}
  POSTGRES_USER: ${POSTGRES_USER:-odp}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odp}
  # Ingestion CLIs. Host is the Compose service, not the host .env localhost.
  # POSTGRES_PORT is the in-network port, not the published host port.
  # Metadata stays on AIRFLOW_DB. The extract uses POSTGRES_DB.
  PYTHONPATH: /opt/odp/repo/src
  ODP_RAW_BUCKET: ${ODP_RAW_BUCKET:-odp-raw}
  MINIO_SMOKE_BUCKET: ${MINIO_SMOKE_BUCKET:-odp-smoke}
  MINIO_ENDPOINT_URL: http://minio:9000
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-odp}
  AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
  ICEBERG_CATALOG_DB: ${ICEBERG_CATALOG_DB:-iceberg}
  KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
  KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
  KAGGLE_KEY: ${KAGGLE_KEY:-}

x-airflow-common: &airflow-common
  image: apache/airflow:3.4.0-python3.12
  environment: *airflow-env
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./docker/airflow/ensure_log_bucket.py:/opt/odp/ensure_log_bucket.py:ro
    # Parents of the mounted package include config/contracts, pyproject.toml,
    # and tests/fixtures. A site-packages install would hide those files.
    - ./src:/opt/odp/repo/src:ro
    - ./config:/opt/odp/repo/config:ro
    - ./pyproject.toml:/opt/odp/repo/pyproject.toml:ro
    - ./tests/fixtures:/opt/odp/repo/tests/fixtures:ro
    - ./data/raw:/opt/odp/repo/data/raw:ro
    - ./docker/airflow/check_ingest_env.py:/opt/odp/check_ingest_env.py:ro
    - odp_airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16.15-bookworm
    container_name: odp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odp}
      POSTGRES_DB: ${POSTGRES_DB:-odp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - odp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: odp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - odp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Stable Spark runtime. The default command sleeps, so profile `up` does
  # not execute SQL. Pass a script from ./docker/spark:
  #   docker compose --profile lakehouse run --rm -T spark /opt/odp/run_poc.sh
  #   docker compose --profile lakehouse run --rm -T spark /opt/odp/run_catalog_probe.sh
  #   docker compose --profile lakehouse run --rm -T \
  #     -e ODP_SPARK_SQL=/tmp/bronze.sql spark /opt/odp/run_bronze.sh
  #     -e ODP_SPARK_SQL=/tmp/silver.sql spark /opt/odp/run_silver.sh
  spark:
    image: spark:3.5.8-java17
    profiles: [lakehouse]
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      ODP_WAREHOUSE_BUCKET: ${ODP_WAREHOUSE_BUCKET:-odp-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-odp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odp}
      ICEBERG_CATALOG_DB: ${ICEBERG_CATALOG_DB:-iceberg}
      HOME: /tmp
    volumes:
      - ./docker/spark:/opt/odp:ro
      # Host Ivy cache for --packages (P2-08). Survives `compose run --rm`.
      - ./.local/spark-ivy:/tmp/.ivy2
    entrypoint: ["/bin/bash"]
    command: ["-c", "exec sleep infinity"]

  # Read-only query side of the P2-02 probe. Start after a Spark script
  # has created the JDBC tables. The image sizes the JVM from the memory
  # Docker gives the container.
  trino:
    image: trinodb/trino:484
    profiles: [lakehouse]
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      ODP_WAREHOUSE_BUCKET: ${ODP_WAREHOUSE_BUCKET:-odp-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-odp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odp}
      ICEBERG_CATALOG_DB: ${ICEBERG_CATALOG_DB:-iceberg}
    # Host port for dbt-trino (P2-06). Inside Compose the service remains trino:8080.
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./docker/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Creates the metadata database. AIRFLOW_DB is a simple identifier, same
  # rule as ICEBERG_CATALOG_DB. The password stays in PGPASSWORD.
  airflow-db-create:
    image: postgres:16.15-bookworm
    profiles: [orchestration]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-odp}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        case "$$AIRFLOW_DB" in
          *[!a-z0-9_]*|"") echo "AIRFLOW_DB must be a simple identifier" >&2; exit 1;;
        esac
        exists="$$(psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$$AIRFLOW_DB'")"
        if [ "$$exists" != "1" ]; then
          psql -h postgres -U "$$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $$AIRFLOW_DB"
        fi
    depends_on:
      postgres:
        condition: service_healthy

  # Migrate, create the local admin, and ensure the log bucket. Runs as root
  # so the log volume can be handed to uid 50000. Does not chown the repo.
  airflow-init:
    <<: *airflow-common
    profiles: [orchestration]
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs
        python /opt/odp/ensure_log_bucket.py
        /entrypoint airflow version
        chown -R "$${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-odp}
    depends_on:
      airflow-db-create:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    profiles: [orchestration]
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    profiles: [orchestration]
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"',
        ]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    profiles: [orchestration]
    command: dag-processor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  odp_postgres_data:
  odp_minio_data:
  odp_airflow_logs:
