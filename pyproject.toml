[project]
name = "open-data-platform"
version = "0.1.0"
description = "Reproducible open-source data platform with a local Compose baseline and an AWS Terraform IaC path."
readme = "README.md"
authors = [
    { name = "Filipe Oliveira", email = "filipeoliveira94@hotmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0,<2",
    "psycopg[binary]>=3.2.1,<4",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "ruff>=0.9.0,<1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
required-version = "==0.13.1"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require local Compose services",
]
addopts = "-q"
