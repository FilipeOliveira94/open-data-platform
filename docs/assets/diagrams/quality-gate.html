<title id="quality-gate-title">Quality gate and quarantine on the batch path</title>
<desc id="quality-gate-desc">At ingestion each record is classified against its contract: a structural error fails the batch, the raw object is stored whole, and findings go to a quarantine sidecar. Bronze copies the finding reasons onto each record; Silver drops or flags the record by the contract's on_invalid policy and records quality counts; stage_quarantine loads the findings for the Gold quality facts. An open Bronze or Silver check blocks the next layer, and the volume guard fails Silver when a snapshot shrinks.</desc>
